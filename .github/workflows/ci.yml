name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false          # datasets/**/*.png pese plusieurs Go, inutile ici

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Every tracked Python file compiles
        run: git ls-files '*.py' | xargs -r python -m py_compile

      - name: Every package.xml is well-formed
        run: |
          for f in $(git ls-files '*package.xml'); do
            python -c "import xml.etree.ElementTree as E; E.parse('$f')"
          done

      - name: CITATION.cff is valid YAML with its required fields
        run: |
          pip install --quiet pyyaml
          python - <<'PY'
          import sys, yaml
          d = yaml.safe_load(open('CITATION.cff'))
          missing = [k for k in ('cff-version', 'message', 'title', 'authors') if k not in d]
          sys.exit(f'CITATION.cff: champs manquants {missing}' if missing else 0)
          PY

      # Un seul script pour la CI, les hooks Git et Claude : secrets, liens
      # internes (tolérances dans .github/known-broken-links.txt), dette d'IP
      # et de chemins codés (signalée, non bloquante).
      - name: Garde-fous du dépôt (secrets, liens, dette)
        run: python scripts/verifier_depot.py --complet

      - name: Tests du vérificateur
        run: python -m unittest -v tests.test_verifier_depot

  build:
    name: colcon build + launch files load
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/mycobot_320pi_R6A
          lfs: false

      - name: Install declared dependencies
        shell: bash
        run: |
          apt-get update
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src --ignore-src -y -r \
            --rosdistro jazzy || true

      - name: colcon build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select mycobot_gateway mycobot_description \
                       --symlink-install --event-handlers console_direct+

      # Le test qui manquait : sim_grasp.launch.py est reste inchargeable douze
      # jours parce que rien n'appelait generate_launch_description().
      - name: Every launch file builds its description
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 -m pytest src/mycobot_320pi_R6A/tests/test_launch_files.py -v
