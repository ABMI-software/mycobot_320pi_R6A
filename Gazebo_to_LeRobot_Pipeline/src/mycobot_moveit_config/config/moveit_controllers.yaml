# Passed directly as a --params-file path, same reason as ompl_planning.yaml:
# the controller_names and joints lists here would otherwise get serialized
# by launch_ros as `!!python/tuple`, which ROS2's parameter parser can't read.
/**:
  ros__parameters:
    moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

    moveit_simple_controller_manager:
      controller_names:
        - mycobot_controller

      mycobot_controller:
        type: FollowJointTrajectory
        action_ns: follow_joint_trajectory
        default: true
        joints:
          - joint2_to_joint1
          - joint3_to_joint2
          - joint4_to_joint3
          - joint5_to_joint4
          - joint6_to_joint5
          - joint6output_to_joint6
