source: '13/10/2026 — forme arducam reposee sur 19 et 23 MESURES AU ROBOT le 15/09
  (19 (87,1 ; 212,4), 23 (110,9 ; -163,0)), meme methode que le 15/09, 2 passes, residu
  2,9 mm. Corrige surtout 25 (1,6 mm) et 26 (3,0 mm), deduits et non mesures : leave-one-out
  25 passe de 8,3 a 2,7 mm, 26 de 4,5 a 0,6. Precedente : planche_actuelle.avant_1310.yaml
  (15/09).'
pourquoi: 'Les deux cameras voyaient les marqueurs a 40-100 mm (arducam) et 62-97
  mm (SVPRO) de leur position mesuree au robot. Le robot ne passe pas par la camera
  : il est la reference. Releve precedent (14/09, a travers une extrinseque fausse)
  : planche_actuelle.avant_1509_verif_robot.yaml.'
a_refaire_si: la planche bouge — et alors la verifier AU ROBOT, jamais par --reference
  a travers une extrinseque dont on n est pas sur.
