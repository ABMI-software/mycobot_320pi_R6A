# Contract for the four-object sorting episodes, HELD-OUT split (12
# episodes). Identical to mycobot_sorting.yaml except the camera: this one
# points at synth_camera_right, a genuinely different, world-fixed vantage
# point already part of the robot rig (mycobot_pro_320_pi_gazebo.urdf,
# world_to_camera_right, pose 0,1.1,0.4 -- confirmed via the URDF, not
# added new), never seen during training. See Part 6.3/6.4 and
# doc/WORLD_SELECTION.md for why a held-out CONDITION (a different mount),
# not held-out images from the same camera, is what this tests.
#
# synth_camera_right is Gazebo-native only until bridged; the launch setup
# must run `ros2 run ros_gz_image image_bridge /synth_camera_right/image`
# for this topic to exist -- not automatic in real_table.launch.py or
# sim_grasp.launch.py, same pattern already used elsewhere in this repo for
# the other synth_camera* topics.

robot_type: mycobot_320_pi
robot_interface: ros2
fps: 30

observations:
  observation.images.heldout:
    channel: {topic: /synth_camera_right/image,
              type: sensor_msgs/msg/Image,
              qos: {reliability: best_effort, history: keep_last, depth: 10}}
    align: {strategy: hold, timeline: header}
    apply: [resize: [224, 224]]

  observation.state:
    channel: {topic: /joint_states, type: sensor_msgs/msg/JointState,
              qos: {reliability: best_effort, history: keep_last, depth: 50}}
    align: {strategy: hold, timeline: header}
    select: [position.joint2_to_joint1, position.joint3_to_joint2,
             position.joint4_to_joint3, position.joint5_to_joint4,
             position.joint6_to_joint5, position.joint6output_to_joint6,
             position.gripper_controller]

actions:
  action:
    channel: {topic: /joint_states, type: sensor_msgs/msg/JointState,
              qos: {reliability: best_effort, history: keep_last, depth: 50}}
    align: {strategy: hold, timeline: header}
    select: [position.joint2_to_joint1, position.joint3_to_joint2,
             position.joint4_to_joint3, position.joint5_to_joint4,
             position.joint6_to_joint5, position.joint6output_to_joint6,
             position.gripper_controller]
