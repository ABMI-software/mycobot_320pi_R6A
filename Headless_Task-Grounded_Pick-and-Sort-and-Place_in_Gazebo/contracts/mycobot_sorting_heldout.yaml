# Contract for the four-object sorting episodes, HELD-OUT split (12
# episodes). Identical to mycobot_sorting.yaml except the feature name: the
# held-out condition is a reserved CAMERA CONFIGURATION, not a different
# sensor. scripts/make_episode_world.py places the world's table camera at
# "heldout_oblique" (front-right, looking down at the work area) for these
# 12 episodes and at "train_overhead" for the 48 train episodes, each with
# small per-episode jitter; no train episode ever uses the held-out
# configuration. Both render /camera/image_raw, 320x240 @ 30 Hz.
#
# (Until 2026-10-03 this pointed at the robot-mounted synth_camera_right,
# which renders at 10 Hz and so cannot produce a 30 fps dataset.)

robot_type: mycobot_320_pi
robot_interface: ros2
fps: 30

observations:
  observation.images.top:     # one key for both splits (2026-10-05): the split differs in camera configuration, not name
    channel: {topic: /camera/image_raw,
              type: sensor_msgs/msg/Image,
              qos: {reliability: best_effort, history: keep_last, depth: 10}}
    align: {strategy: hold, timeline: header}
    apply: [resize: [224, 224]]

  observation.state:
    channel: {topic: /joint_states, type: sensor_msgs/msg/JointState,
              qos: {reliability: best_effort, history: keep_last, depth: 50}}
    align: {strategy: hold, timeline: header}
    select: [position.joint2_to_joint1, position.joint3_to_joint2,
             position.joint4_to_joint3, position.joint5_to_joint4,
             position.joint6_to_joint5, position.joint6output_to_joint6,
             position.gripper_controller]

actions:
  action:
    channel: {topic: /joint_states, type: sensor_msgs/msg/JointState,
              qos: {reliability: best_effort, history: keep_last, depth: 50}}
    align: {strategy: hold, timeline: header}
    select: [position.joint2_to_joint1, position.joint3_to_joint2,
             position.joint4_to_joint3, position.joint5_to_joint4,
             position.joint6_to_joint5, position.joint6output_to_joint6,
             position.gripper_controller]

# Recorded for FUTURE batches (added 2026-10-05), not used as a frame key:
# the controller's desired state and the gripper command. The 2026-10-04
# batch recorded neither, so its datasets take action[t] = state[t+1]
# (scripts/port_bag.py); with these in the bag, a future converter can take
# the commanded position as the action instead. Raw passthrough into the bag.
adjunct:
  - channel: {topic: /mycobot_controller/controller_state,
              type: control_msgs/msg/JointTrajectoryControllerState,
              qos: {reliability: reliable, history: keep_last, depth: 50}}
  - channel: {topic: /gripper_position_controller/commands,
              type: std_msgs/msg/Float64MultiArray,
              qos: {reliability: reliable, history: keep_last, depth: 10}}
