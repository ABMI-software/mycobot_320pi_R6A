# Addendum, 19/10/2026, committed before any Run C code was run on a GPU.
run_c_midway_stop:
  question: >
    Run C (whole vision encoder, batch 6 x 5 accumulated, two Kaggle sessions) keeps weights every
    2 500 steps. Between the two sessions, is the recipe already failing, so the second session's
    ~10 h of quota can be saved?
  checkpoint: the newest kept checkpoint of the first session
  tests: >
    the run_c_gate probe (part 1 data, probe and metric) and the image-swap test (part 2 data and
    metrics), as written above
  stop_if: >
    EITHER the encoder localises worse than smolvla_base: linear probe on the connector, median
    error above smolvla_base's with the 95 % bootstrap interval of the paired difference entirely
    above 0, on at least 2 of the 3 cameras (no size threshold: mid-run, any reliable loss of
    localisation counts);
    OR the policy no longer uses the images: either part-2 criterion fails (lower end of the 95 %
    interval of the grasp-point shift, or of the donor-share change, at or below 0).
  otherwise: run the second session; the full run_c_gate applies to its checkpoints.

# ---------------------------------------------------------------------------------------------
# Record, 19/10/2026: Run C's gradient-accumulation check (smolvla_kaggle_driver.py, accumcheck).
accumulation_check:
  rule: >
    fixed before the first GPU run (driver CHECK_LIMITS, commit f68b04cb): on every step not
    skipped by the fp16 loss scaler, at least 3 of them, accumulated against whole batch from the
    same state, batch, noise and times: loss, pre-clip gradient norm and gradients (overall and
    per group) within 1 %, weight update (overall and per group) within 5 %
  acceptance_of_the_update_limit: >
    agreed 19/10: a weight-update difference above 5 % is accepted as Adam's first steps
    amplifying rounding (each weight moves by about +/- lr whatever its gradient) only if the floor
    (the same whole batch run twice) shows a comparable difference. Future checks judge the update
    after several steps, or leave out weights whose gradient is near zero.
  t4_batch_8_vs_2x4: >
    one step judged, out of memory at step 2 (the optimizer state appears there): FAIL as written.
    Step 1, relative difference, floor / accumulated: loss 0 / 6.5e-5; gradients 0.038 % / 0.26 %
    (vision 0.062 / 0.41, connector 0.0002 / 0.16, expert 0.0002 / 0.08); weight update 1.4 % /
    6.0 % (vision 2.1 / 8.0, connector ~1e-4 / 5.1, expert ~1e-4 / 3.5). Gradients pass by 4x.
    The update difference is ~20-45 x the gradient difference in both (the step-1 amplification
    shows in the floor: 0.062 % -> 2.1 % in the vision encoder, the only non-deterministic part),
    but the floor's update difference is ~4 x smaller than the accumulated one, so "comparable" is
    not met on this step and the update limit is not accepted on it.
  t4_batch_6_vs_2x3: >
    19/10/2026, 6 steps: PASS under the rule as committed (decision_amplification not needed).
    Steps 2 and 4 skipped by the fp16 loss scaler (overflow at the initial scale 65536, halved
    each time); 4 steps judged. Relative difference, accumulated (floor): step 1 gradients 0.12 %
    (0.040 %), update 3.8 % (1.4 %), vision 4.3 % (2.1 %); step 3 gradients 0.069 % (0.031 %),
    update 0.29 % (0.20 %); step 5 0.10 % (0.011 %), 0.14 % (0.063 %); step 6 0.097 % (0.013 %),
    0.13 % (0.063 %). Gradient norm within 1.3e-4, loss within 1.0e-4 on every step. The
    update/gradient amplification is ~30 x at step 1 (accumulated 32, floor 35: 0.9 x) and falls
    to ~4 x at step 3 and ~1.4 x at steps 5-6, as Adam's first-step effect predicts; the 6.0 %
    at batch 8 step 1 was that effect on a larger gradient difference. Peak nvidia-smi 12441 MB.
    Verdict: the gradient accumulation is correct on the T4 path Run C uses.
  decision_amplification: >
    Decided by the project owner on 19/10/2026, before the batch-6 rerun: if loss, gradient norm
    and gradients pass their limits (1 %) but the weight update still exceeds 5 %, the
    accumulation is accepted as correct when the amplification factor (weight-update difference
    divided by gradient difference) of the accumulated pass is of the same order as the floor's.
    Reason: a scaling or stepping bug in the accumulation would show as a large difference in
    the pre-clip gradient norm, which at batch 8 was 7.2e-6.
    Made concrete here, before any batch-6 result: "same order" means the accumulated factor is
    between 0.1 x and 10 x the floor's, on every judged step (at least 3), overall and in every
    group where the floor's gradient difference is measurable (at least 1e-4 relative; below
    that the floor's gradients are identical to float32 rounding and have no factor: at batch 8
    the connector and the expert, 1.5e-6). Loss, gradient-norm and gradient limits and the
    3-step minimum are unchanged.
    Batch-8 step 1, for reference (not judged by this decision, one step only): overall floor
    1.38e-2 / 3.81e-4 = 36, accumulated 5.97e-2 / 2.62e-3 = 23 (0.63 x); vision floor
    2.09e-2 / 6.21e-4 = 34, accumulated 7.99e-2 / 4.14e-3 = 19 (0.57 x); connector and expert
    without a floor factor.

