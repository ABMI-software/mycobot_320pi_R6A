# Addendum, 27/10/2026, committed before session 2 runs (no Run C checkpoint past 5 000 exists).
run_c_final_report:
  question: >
    Run C 5 000 localises the pieces far better than smolvla_base (connector probe ~20 mm against
    32-39; frozen head 19.8 mm on the probe layouts) but its open-loop grasps are not measurably
    better than the frozen-encoder runs (run_c_midway_checkpoint.follow_up_27_10). At 10 000, did
    the better localisation become better grasps?
  must_contain: >
    side by side, for Run C 10 000 (and 5 000, 7 500 for the trend): (a) the connector linear probe
    per camera against smolvla_base, with its 95 % paired bootstrap interval (run_c_gate part 1);
    (b) the frozen head's median and p90 on the 799 probe layouts (scripts/aux_head_probe.py);
    (c) the image-swap test (run_c_gate part 2); (d) the own-image open loop on seeds 91-100, the
    same 120 chunks, Run C minus Run B 20k (same training data, encoder frozen): grasp-point error
    (open_loop_compare.py, difference of medians on the chunks where both close, 95 % interval from
    2000 episode resamples, with the number of chunks) and the share of chunks closing within
    20 mm of the recorded close (scripts/open_loop_within20.py, same bootstrap), plus tip, joint,
    gripper error and the number of chunks that close from an open gripper; also Run C 5 000 minus
    Run B 5 000 (matched samples seen: 150 000 against 160 000).
  grasp_statement: >
    "better localisation became better grasps" only if, for Run C 10 000 minus Run B 20k, the
    upper end of the grasp-point interval is below 0 AND the within-20 mm share is not lower (its
    interval's lower end at or above 0). "Not shown" if the grasp-point interval contains 0;
    "worse grasps" if its lower end is above 0. The within-20 mm share alone decides nothing (1-2
    of 120 chunks at 5 000). The statement goes in the report and in SESSION_RESUME.md's handover,
    word for word, with its numbers.
  not_judged_here: >
    Gazebo success; this report says only whether the open-loop grasps moved with the encoder.
    run_c_gate still decides which checkpoint goes to Gazebo.
